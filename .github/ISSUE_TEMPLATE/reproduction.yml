name: Reproduction problem
description: A number you recomputed does not match, or a script fails.
labels: ["reproduction"]
body:
  - type: input
    id: number
    attributes:
      label: Which reported number or script?
      placeholder: "e.g. 650 vs 566, or code/analyze_probe.py"
    validations:
      required: true
  - type: textarea
    id: got
    attributes:
      label: What you ran and what you got
      description: Paste the command and the full output.
      render: text
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "Windows 11, Python 3.12, pandas 2.2"
